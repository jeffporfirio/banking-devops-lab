stages:
  - test
  - build

test:
  stage: test
  image: python:3.12

  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python -m pytest

docker-build:
  stage: build
  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  script:
    - docker build -t banking-api:$CI_COMMIT_SHORT_SHA .
