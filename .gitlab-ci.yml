stages:
  - test
  - build
  - publish

test:
  stage: test
  image: python:3.12

  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python -m pytest

docker-build:
  stage: build
  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  script:
    - docker build -t $CI_REGISTRY_IMAGE/banking-api:$CI_COMMIT_SHORT_SHA .
    - docker save $CI_REGISTRY_IMAGE/banking-api:$CI_COMMIT_SHORT_SHA -o banking-api.tar

  artifacts:
    paths:
      - banking-api.tar
    expire_in: 1 hour

docker-push:
  stage: publish
  image: docker:27

  services:
    - docker:27-dind

  variables:
    DOCKER_TLS_CERTDIR: "/certs"

  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u "$CI_REGISTRY_USER" --password-stdin

  script:
    - docker load -i banking-api.tar
    - docker push $CI_REGISTRY_IMAGE/banking-api:$CI_COMMIT_SHORT_SHA
