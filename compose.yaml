services:

  api:
    image: host.docker.internal:8082/docker-local/banking-api:cc141427
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: