
services:
  api:
    image: ${API_IMAGE:?API_IMAGE not set}
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_USERNAME: ${MONGO_USERNAME:?MONGO_USERNAME not set}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD not set}
      MONGO_AUTH_SOURCE: banking_lab
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    command: ["mongod", "--auth"]
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
